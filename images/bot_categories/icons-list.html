<html dark="false">
<head>
<style>
	html, body {
		padding: 0;
		margin: 0;
		min-height: 100vh;
	}
	body {
		background-color: #FFF;
	}
	html[dark="true"] body {
		color: #ccc;
		background-color: #202329;
	}
	body {
		display: flex;
		flex-direction: row;
		justify-content: center;
		align-items: center;
	}
	div#container {
		display: grid;
		grid-template-columns: 1fr 1fr;
	}
	div#container > div {
		display: flex;
		flex-direction: column;
		flex-shrink: 0;
		line-height: 30px;
		font-family: "Segoe UI";
		font-size: 13px;
		padding: 50px 30px;
		white-space: nowrap;
	}
	img {
		vertical-align: center;
		margin-right: 5px;
		max-height: 16px;
		width: 16px;
		object-fit: none;
		object-position: center;
		filter: invert(27%) sepia(19%) saturate(505%) hue-rotate(155deg) brightness(91%) contrast(94%);
	}
	html[dark="true"] img {
		filter: invert(100%) sepia(0%) saturate(4337%) hue-rotate(220deg) brightness(80%) contrast(101%);
	}
</style>
</head>
<body>
<div id="container">

<div>
<span><img src="generic-bot.svg" /> Generic Bot</span>
<span><img src="monitor.svg" /> Site/Network Monitor</span>
<span><img src="read-it-later-service.svg" /> Read-it-later Service</span>
<span><img src="validator.svg" /> Validator</span>
<span><img src="security-checker.svg" /> Security Checker</span>
<span><img src="service-agent.svg" /> Service Agent</span>
<span><img src="service-bot.svg" /> Service bot</span>
<span><img src="social-media-agent.svg" /> Social Media Agent</span>
<span><img src="benchmark.svg" /> Benchmark (ApacheBench only)</span>
</div>

<div>
<span><img src="ai-agent.svg" /> AI Agent</span>
<span><img src="ai-assistant.svg" /> AI Assistant</span>
<span><img src="ai-search-crawler.svg" /> AI Search Crawler</span>
<span><img src="ai-data-scraper.svg" /> AI Data Scraper</span>
<span><img src="crawler.svg" /> Crawler</span>
<span><img src="search-bot.svg" /> (Security) Search Bot/tools</span>
<span><img src="feed-fetcher.svg" /> Feed Fetcher</span>
<span><img src="feed-parser.svg" /> Feed Parser</span>
<span><img src="feed-reader.svg" /> Feed Reader</span>
</div>

</div>
</body>
</html>
